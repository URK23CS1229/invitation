  <!-- ================= 1. OPENING SCREEN: ENVELOPE ================= -->
  <section id="intro" class="intro" aria-label="அழைப்பிதழ் உறை">
    <!-- lotus-pond video plays first (~2.5 s), then the envelope floats in over it -->
    <div class="intro-bg" aria-hidden="true">
      <video id="introVideo" src="assets/video/lotus-pond.mp4" poster="assets/video/lotus-pond-poster.jpg"

    <div class="intro-glow" aria-hidden="true"></div>
    <svg class="intro-corner tl" aria-hidden="true"><use href="#corner"/></svg>

    <svg class="intro-corner bl" aria-hidden="true"><use href="#corner"/></svg>
    <svg class="intro-corner br" aria-hidden="true"><use href="#corner"/></svg>

    <p class="intro-kicker" data-key="introKicker"></p>

        <div class="env-back"></div>

            <p class="letter-names"><span data-key="brideTa"></span> <span class="amp">&amp;</span> <span data-key="groomTa"></span></p>
            <svg class="letter-divider" aria-hidden="true"><use href="#divider"/></svg>

          <use href="#lotus-leaf" x="160" y="172" width="40" height="16"/>
          <use href="#lotus" x="126" y="156" width="48" height="33"/>
          <use href="#lotus-bud" x="108" y="160" width="12" height="25" transform="rotate(-16 114 172)"/>

          <use href="#corner" x="251" y="151" width="40" height="40" transform="rotate(180 271 171)"/>

        <div class="env-flap" id="flap">
          <svg class="flap-face flap-front" viewBox="0 0 300 120" preserveAspectRatio="none" aria-hidden="true">
            <path fill="url(#gPaper)" d="M0 0h300L163 112q-13 9-26 0Z"/>
            <g fill="none" stroke="url(#gGold)" stroke-linecap="round">

  <!-- ================= 2. MAIN INVITATION ================= -->

    <!-- Hero: names under a floral arch -->

      <div class="frame">

        <svg class="frame-corner tr" aria-hidden="true"><use href="#corner"/></svg>
        <svg class="frame-corner bl" aria-hidden="true"><use href="#corner"/></svg>
        <svg class="frame-corner br" aria-hidden="true"><use href="#corner"/></svg>

        <p class="blessing reveal" data-key="topBlessing"></p>
        <p class="kicker reveal" data-key="heroKicker"></p>

        <div class="arch-wrap">
          <svg class="gopuram" aria-hidden="true"><use href="#gopuram"/></svg>
          <!-- floral arch is generated in JS (flowers placed along this path) -->
          <svg class="arch" id="arch" viewBox="0 0 320 360" aria-hidden="true">
            <path id="archPath" d="M28 352V170C28 80 92 22 160 22s132 58 132 148v182" fill="none"/>

          <svg class="pond-leaf l"><use href="#lotus-leaf"/></svg>
          <svg class="pond-leaf r"><use href="#lotus-leaf"/></svg>

          <svg class="pond-lotus side l sway"><use href="#lotus"/></svg>

          <svg class="pond-bud r sway"><use href="#lotus-bud"/></svg>

          <span data-key="scrollHint"></span>
          <i aria-hidden="true"></i>
        </a>

    </section>

    <!-- Event details -->
    <section class="panel details" id="details">
      <div class="frame">
        <svg class="frame-corner tl" aria-hidden="true"><use href="#corner"/></svg>
        <svg class="frame-corner tr" aria-hidden="true"><use href="#corner"/></svg>
        <svg class="frame-corner bl" aria-hidden="true"><use href="#corner"/></svg>
        <svg class="frame-corner br" aria-hidden="true"><use href="#corner"/></svg>

        <svg class="section-lotus reveal" aria-hidden="true"><use href="#lotus"/></svg>
        <h2 class="section-title reveal" data-key="detailsTitle"></h2>
        <svg class="divider reveal" aria-hidden="true"><use href="#divider"/></svg>

        <div class="info-list">
          <article class="info reveal">
            <span class="info-icon"><svg><use href="#i-calendar"/></svg></span>
            <div>
              <h3 data-key="dateLabel"></h3>
              <p class="info-main" data-key="dateText"></p>
              <p class="info-sub" data-key="dayText"></p>
            </div>
          </article>

          <article class="info reveal">
            <span class="info-icon"><svg><use href="#i-clock"/></svg></span>
            <div>
              <h3 data-key="timeLabel"></h3>
              <p class="info-main" data-key="timeText"></p>
            </div>
          </article>

          <article class="info reveal">
            <span class="info-icon"><svg><use href="#i-pin"/></svg></span>
            <div>
              <h3 data-key="venueLabel"></h3>
              <p class="info-main" data-key="venueName"></p>
              <p class="info-sub" data-key="venueNote"></p>
            </div>
          </article>
        </div>

        <a class="map-btn reveal" id="mapBtn" href="#" target="_blank" rel="noopener">
          <svg aria-hidden="true"><use href="#i-pin"/></svg>
          <span data-key="mapButton"></span>
          <svg aria-hidden="true"><use href="#i-arrow"/></svg>
        </a>

        <div class="countdown reveal" id="countdown">
          <p class="countdown-label" data-key="countdownLabel"></p>
          <div class="countdown-grid">
            <div><b id="cdDays">0</b><span data-key="cdDays"></span></div>
            <div><b id="cdHours">0</b><span data-key="cdHours"></span></div>
            <div><b id="cdMins">0</b><span data-key="cdMins"></span></div>
            <div><b id="cdSecs">0</b><span data-key="cdSecs"></span></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Closing blessing -->
    <section class="panel closing" id="closing">
      <div class="frame">
        <svg class="frame-corner tl" aria-hidden="true"><use href="#corner"/></svg>
        <svg class="frame-corner tr" aria-hidden="true"><use href="#corner"/></svg>
        <svg class="frame-corner bl" aria-hidden="true"><use href="#corner"/></svg>
        <svg class="frame-corner br" aria-hidden="true"><use href="#corner"/></svg>

        <div class="lotus-cluster reveal" aria-hidden="true">
          <svg class="c-leaf"><use href="#lotus-leaf"/></svg>
          <svg class="c-bud l sway"><use href="#lotus-bud"/></svg>
          <svg class="c-lotus sway"><use href="#lotus"/></svg>
          <svg class="c-bud r sway"><use href="#lotus-bud"/></svg>
        </div>

        <p class="closing-msg reveal" data-key="closingMessage"></p>
        <svg class="divider reveal" aria-hidden="true"><use href="#divider"/></svg>
        <p class="sign-off reveal" data-key="closingSign"></p>
        <p class="families reveal" data-key="families"></p>

        <div class="monogram reveal" aria-hidden="true">
          <span class="mono-i" data-key="initial1"></span>
          <svg><use href="#lotus"/></svg>
          <span class="mono-i" data-key="initial2"></span>
        </div>
      </div>
    </section>
  </main>

  <!-- Music on/off -->
  <button class="music-btn" id="musicBtn" type="button" aria-pressed="false" aria-label="இசை">
    <svg class="on"><use href="#i-music"/></svg>
    <svg class="off"><use href="#i-music-off"/></svg>
    <span class="ring" aria-hidden="true"></span>
  </button>
  <audio id="bgm" loop preload="auto"></audio>

  <noscript><p class="noscript">இந்த அழைப்பிதழைக் காண JavaScript ஐ இயக்கவும். / Please enable JavaScript.</p></noscript>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
